<script>
/* script-schedule.html — ตารางเวร module: setup/dash/collect/grid/reports/oncall/balance.
   Calls api_generateSchedule/api_saveSchedule/api_loadCalendar/api_calculateWorkload/
   api_exportExcel — names match the required generateSchedule()/saveSchedule()/
   loadCalendar()/calculateWorkload()/exportExcel(). Grid rendering (tokEl()/cellToks()/
   renderGrid()/renderContacts()/dowCls()) ported 1:1 in look from the original
   labthungfon-platform-v4_43.html (lines ~2432-2519). */

/* ตั้งขนาดกระดาษก่อนพิมพ์ผ่าน <style> ฉีดเข้า <head> — เลี่ยงบั๊ก Chrome ที่แทรกหน้าเปล่า
   หน้าแรกเมื่อใช้ named @page (ดูคอมเมนต์ใน style.html) */
function printWithPageSize(size) {
  var el = document.getElementById('printPageSize');
  if (!el) {
    el = document.createElement('style');
    el.id = 'printPageSize';
    document.head.appendChild(el);
  }
  el.textContent = '@media print{@page{' + size + '}}';
  window.print();
}

var Schedule = (function () {
  var current = { year: new Date().getFullYear() + 543, month: new Date().getMonth() };
  var calendarData = null, peopleCache = null, rolePermsCache = null, leaveMap = {};
  var printColorListenerAdded = false;

  /* ── สิทธิ์แก้ไข/ลบรายการ on-call/วันลา: เห็นของคนอื่นได้ แต่แก้ได้แค่ของตัวเอง ยกเว้นแอดมิน ── */
  function isAdmin_() { return !!(Session.user && Session.user.role === 'admin'); }
  function myPersonId_() { return (Session.user && Session.user.personId) || ''; }
  function canEditRecord_(pid) { return isAdmin_() || (!!myPersonId_() && myPersonId_() === pid); }

  /* ── shift token defs, identical colors to the original .tok.* classes ── */
  var SHIFT_DEFS = {
    ch: { short: 'ช', name: 'เวรเช้า 08-16', bg: '#d9ebe8', color: '#0a4f47' },
    b: { short: 'บ', name: 'เวรบ่าย 16-00', bg: '#e7eef8', color: '#2f5fa0' },
    d: { short: 'ด', name: 'เวรดึก On call 00-08', bg: '#f7ecd6', color: '#7a5618' },
    n: { short: 'x', name: 'เวรคลินิกนอกเวลา 07-08', bg: '#ede0c4', color: '#6b4e16' },
    /* สัญลักษณ์ บ1 เปลี่ยนเป็น "บ ขีดเส้นใต้" ตามฟีดแบ็ก — u:true ให้ tokEl ใส่เส้นใต้
       (key 'b1' และข้อความที่บันทึกลง log/option ยังคง "บ1" เดิม ไม่กระทบข้อมูล) */
    b1: { short: 'บ', u: true, name: 'เวรบ่าย 16-20', bg: '#efe7f7', color: '#7a4fa0' }
  };
  var REPORT_TABS = [
    { id: 'otsheet', label: 'OT timesheet' }, { id: 'otsheetb1', label: 'OT timesheet (<u>บ</u>)' }, { id: 'otsheetd', label: 'OT timesheet (เวรดึก)' }, { id: 'nsheet', label: 'เวรคลินิก (น)' },
    { id: 'pay', label: 'ใบเบิกเงินรวม' }, { id: 'payLandscape', label: 'ใบเบิกเงินรวม (แนวนอน A4)' },
    { id: 'payperson', label: 'รายบุคคล' },
    { id: 'shiftsummary', label: 'สรุปรายเวร' }, { id: 'teamoverview', label: 'ภาพรวมทีม' },
    { id: 'ocrec', label: 'บันทึก on-call' }, { id: 'occlaim', label: 'บันทึก on-call (รายละเอียด)' },
    { id: 'ocstats', label: 'สถิติ on-call' }
  ];

  function setMonthYear(year, month) { current.year = year; current.month = month; render(_schedActiveTab); }
  function monthLabel() { return TH_M[current.month] + ' ' + current.year; }
  function dowLabel() { return ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส']; }
  function isWknd(year, month, d) { var w = new Date(year - 543, month, d).getDay(); return w === 0 || w === 6; }

  function tokEl(t, suffix) { var s = SHIFT_DEFS[t]; return '<span class="tok" style="background:' + s.bg + ';color:' + s.color + (s.u ? ';text-decoration:underline;text-underline-offset:2px' : '') + '">' + s.short + (suffix || '') + '</span>'; }

  function loadPeople() {
    if (peopleCache) return Promise.resolve(peopleCache);
    return gsRun('api_bootstrap', Session.token).then(function (boot) { peopleCache = boot.people; return peopleCache; });
  }

  /* Cached reads — cuts repeat Apps Script round trips when switching between
     grid/dash/balance/oncall tabs for the same month (fixes "คลิกเข้าเมนูแล้วช้า"). */
  function ymKey(prefix) { return prefix + '_' + current.year + '_' + current.month; }
  function loadCalendarCached() { return cachedGsRun(ymKey('cal'), 15000, 'api_loadCalendar', Session.token, current.year, current.month); }
  function loadWorkloadCached() { return cachedGsRun(ymKey('wl'), 15000, 'api_calculateWorkload', Session.token, current.year, current.month); }
  /* หมายเหตุ: ไม่ล้าง ymKey('oc') ที่นี่ — หน้า on-call เป็นเจ้าของ cache นั้นเองและ patch มันทันที
     หลังเซิร์ฟเวอร์ตอบรับ (แล้ว loadOncallTable ก็ดึงข้อมูลจริงมาทับอยู่แล้วทุกครั้ง) ถ้าล้างตรงนี้
     การวาดผลทันทีจะใช้ไม่ได้ ส่วน bal/rep เป็นข้อมูลที่คำนวณจากตาราง+on-call จึงต้องล้างเมื่อมีการแก้ */
  function invalidateMonthCache() {
    invalidateCache(ymKey('cal')); invalidateCache(ymKey('wl')); invalidateCache(ymKey('av'));
    invalidateCache(ymKey('bal')); invalidateCache(ymKey('rep'));
  }
  /* รวม object แบบตื้น (base + patch) — ใช้เขียนผลที่เซิร์ฟเวอร์ตอบรับแล้วลง cache เพื่อวาดทันที */
  function mergeObj_(base, patch) {
    var o = {}, k;
    for (k in base) o[k] = base[k];
    for (k in patch) o[k] = patch[k];
    return o;
  }
  /* แก้ข้อมูลใน cache แล้ววาดใหม่ทันที (หลังเซิร์ฟเวอร์ตอบรับ) — การดึงข้อมูลรอบถัดไปจะ reconcile ให้ตรงเซิร์ฟเวอร์เอง */
  function cachePatchAndPaint_(key, mutate, paint) {
    var v = cacheGet(key);
    if (v === undefined) return;
    mutate(v);
    cachePut(key, v);
    paint(v);
  }
  /* แถวสถานะในตาราง (กำลังโหลด / โหลดพลาด+ลองใหม่) ให้ผู้ใช้เห็นความคืบหน้าแทน overlay เต็มจอ */
  function tblLoadingRow_(cols) { return '<tr><td colspan="' + cols + '" style="color:var(--mut);padding:14px"><i class="ti ti-loader-2 oc-spin"></i> กำลังโหลดข้อมูล...</td></tr>'; }
  function tblErrorRow_(cols, err, retryId) {
    return '<tr><td colspan="' + cols + '" style="color:var(--coral);padding:14px">โหลดข้อมูลไม่สำเร็จ: ' +
      (err && err.message || err) + ' — <a href="#" id="' + retryId + '">ลองใหม่</a></td></tr>';
  }
  function bindRetry_(id, fn) {
    var el = document.getElementById(id);
    if (el) el.onclick = function (e) { e.preventDefault(); fn(); };
  }

  /* #printSign อยู่นอก #app แล้ว (persistent element ใน index.html ไม่ผูกกับ frame ระบบ) — ต้องเคลียร์เอง
     ทุกครั้งที่สลับแท็บย่อยของตารางเวร ไม่งั้นเนื้อหาลงนามเก่าจากตอนดูหน้า grid จะค้างและโผล่ตอนพิมพ์
     หน้าอื่น (เช่น รายงาน) โดยไม่ตั้งใจ — renderGridPage()/loadAndRenderGrid() จะเติมกลับให้เองถ้า sub เป็น grid */
  function clearPrintSign_() {
    var el = document.getElementById('printSign');
    if (el) el.innerHTML = '';
  }

  function render(sub) {
    clearPrintSign_();
    var page = document.getElementById('schedInner');
    if (sub === 'reports') return renderReportsPage(page);
    if (sub === 'oncall') return renderOncallPage(page);
    if (sub === 'setup') return renderSetupPage(page);
    if (sub === 'dash') return renderSchedDashPage(page);
    if (sub === 'collect') return renderCollectPage(page);
    if (sub === 'balance') return renderBalancePage(page);
    return renderGridPage(page);
  }

  /* ════════════════ GRID (ported from renderGrid()/renderContacts()) ════════════════ */

  /* หัวตารางเวร — บรรทัด 1: ชื่อรายงาน + กลุ่มงาน/โรงพยาบาล, บรรทัด 2: ช่วงวันที่เต็มเดือน ตามฟีดแบ็ก
     (เดิมแสดง "...และในวันหยุด — มิถุนายน 2569" สั้นไป) */
  function gridTitleHtml() {
    var s = Session.settings || {};
    var orgLine = [s.org, s.hosp].filter(Boolean).join(' ');
    var lastDay = new Date(current.year - 543, current.month + 1, 0).getDate();
    var rangeLine = 'ตั้งแต่วันที่ 1 ' + TH_M[current.month] + ' ' + current.year + ' ถึงวันที่ ' + lastDay + ' ' + TH_M[current.month] + ' ' + current.year;
    return '<div id="gridTitle" style="font-size:16px;font-weight:700;">ตารางปฏิบัติงานนอกเวลาราชการและวันหยุดราชการ' + (orgLine ? ' ' + orgLine : '') + '</div>' +
      '<div id="gridTitleRange" style="font-size:13px;font-weight:600;margin-top:2px;">' + rangeLine + '</div>';
  }

  function renderGridPage(page) {
    page.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:10px;">' +
      '<div>' + gridTitleHtml() +
      '<div class="topbar-sub" id="gridSub" style="margin-top:2px;"></div></div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
      '<span id="statusBadge"></span>' +
      '<button class="btn btn-primary btn-sm" id="genBtn"><i class="ti ti-refresh"></i> สร้างตารางเวร</button>' +
      '<button class="btn btn-sm" id="blankBtn"><i class="ti ti-file-plus"></i> สร้างตารางเปล่า</button>' +
      '<button class="btn btn-danger btn-sm" id="clearBtn"><i class="ti ti-eraser"></i> เคลียร์</button>' +
      '<button class="btn btn-sm" id="balanceBtn" style="background:var(--tl-l);color:var(--tl-d);border-color:var(--tl);"><i class="ti ti-scale"></i> สมดุลเวร</button>' +
      '<button class="btn btn-sm" id="pubBtn"><i class="ti ti-send"></i> เผยแพร่</button>' +
      '<button class="btn btn-sm" id="printBtn"><i class="ti ti-printer"></i> พิมพ์</button>' +
      '<button class="btn btn-sm" id="printColorBtn"><i class="ti ti-printer"></i> พิมพ์สี</button>' +
      '<button class="btn btn-sm" id="printHandoutBtn" title="พิมพ์แบบไม่แสดงยอดเงิน สำหรับแจกในทีม"><i class="ti ti-printer"></i> พิมพ์แจก</button>' +
      '</div></div>' +
      '<div class="legend" id="legend"></div>' +
      '<div class="sched-wrap"><table class="sched" id="schedTbl"></table></div>' +
      '<div id="violationsPanel" style="margin-top:12px;"></div>' +
      '<div class="info-row">' +
      '<div class="card" id="contactCard" style="margin-top:14px;"><div class="card-title"><i class="ti ti-address-book"></i>จุดปฏิบัติงาน & ข้อมูลติดต่อ</div>' +
      '<div class="contact-grid" id="contactGrid"></div></div>' +
      '<div class="card print-only" id="workHoursPrint" style="display:none;"></div>' +
      '</div>' +
      /* Override Log ย่อ/ขยายได้ — ค่าเริ่มต้นย่อ กดหัวการ์ดเพื่อขยาย */
      '<div class="card" id="ovrLogCard" style="display:none;"><div class="card-title" id="ovrLogHead" style="cursor:pointer;user-select:none;margin-bottom:0;"><i class="ti ti-history"></i>Override Log ' +
      '<span class="badge none" id="ovrLogCount" style="margin-left:6px;"></span>' +
      '<i class="ti ti-chevron-down" id="ovrLogChev" style="margin-left:auto;"></i></div>' +
      '<div class="tbl-wrap" id="ovrLogWrap" style="display:none;margin-top:10px;"><table class="tbl" id="ovrLogTbl"></table></div></div>';
      /* #printSign ไม่ได้อยู่ใน HTML ที่ inject ตรงนี้อีกต่อไป — ย้ายไปเป็น element ถาวรนอก #app ใน index.html แล้ว
         (ดูเหตุผลใน index.html/style.html) renderPrintSign() ยังหา document.getElementById('printSign') เจอตามปกติ */

    renderLegend();

    document.getElementById('genBtn').onclick = function () {
      gsRun('api_generateSchedule', Session.token, current.year, current.month).then(function (result) {
        invalidateMonthCache();
        toast('สร้างตารางสำเร็จ', 'ปรับสมดุล ' + result.postBalanceSwaps + ' เวร · พบ ' + result.ruleViolations.length + ' ข้อควรตรวจสอบ');
        loadAndRenderGrid();
      });
    };
    document.getElementById('blankBtn').onclick = function () {
      if (!confirm('สร้างตารางเปล่าเดือน ' + monthLabel() + '?\n\nตารางจะว่างทั้งเดือน (ไม่จัดเวรอัตโนมัติ) เพื่อให้จัดเวรเองผ่าน Override — ข้อมูลวันลายังแสดงตามปกติ\n\nหากเดือนนี้มีตารางเวรอยู่แล้วจะถูกล้างทั้งหมด')) return;
      gsRun('api_createBlankSchedule', Session.token, current.year, current.month).then(function () {
        invalidateMonthCache();
        toast('สร้างตารางเปล่าแล้ว', 'คลิกช่องในตารางเพื่อเพิ่ม/จัดเวรเองได้เลย');
        loadAndRenderGrid();
      });
    };
    document.getElementById('clearBtn').onclick = function () {
      if (!confirm('ยืนยันเคลียร์ตารางเวรเดือน ' + monthLabel() + '?\n\nจะลบตารางเวร, ประวัติ Override, และข้อควรตรวจสอบทั้งหมดของเดือนนี้ เหมือนไม่เคยกด "สร้างตารางเวร" มาก่อน\n\nการกระทำนี้ไม่สามารถย้อนกลับได้')) return;
      gsRun('api_clearSchedule', Session.token, current.year, current.month).then(function (result) {
        invalidateMonthCache();
        toast('เคลียร์ตารางเวรแล้ว', 'ลบตารางเวร ' + result.deletedSchedules + ' รายการ · ลบประวัติ ' + result.deletedTransactions + ' รายการ');
        loadAndRenderGrid();
      });
    };
    document.getElementById('pubBtn').onclick = function () {
      gsRun('api_publishSchedule', Session.token, current.year, current.month).then(function () {
        invalidateMonthCache();
        toast('ประกาศใช้แล้ว');
        loadAndRenderGrid();
      });
    };
    document.getElementById('balanceBtn').onclick = function () { schedSwitchTab('balance'); };
    document.getElementById('printBtn').onclick = function () { printWithPageSize('size:A4 landscape;margin:6mm'); };
    document.getElementById('printColorBtn').onclick = function () {
      document.documentElement.classList.add('print-color');
      printWithPageSize('size:A4 landscape;margin:6mm');
    };
    /* พิมพ์แจก = พิมพ์ปกติแต่ซ่อนยอดเงิน (.money-only) สำหรับแจกในทีม — ใช้ class ที่ <html>
       แบบเดียวกับ print-color เพื่อให้ CSS @media print เลือกซ่อนได้โดยไม่ต้อง re-render ตาราง */
    document.getElementById('printHandoutBtn').onclick = function () {
      document.documentElement.classList.add('print-handout');
      printWithPageSize('size:A4 landscape;margin:6mm');
    };
    if (!printColorListenerAdded) {
      printColorListenerAdded = true;
      window.addEventListener('afterprint', function () {
        document.documentElement.classList.remove('print-color');
        document.documentElement.classList.remove('print-handout');
      });
    }
    if (!Session.permissions.publish) document.getElementById('pubBtn').disabled = true;

    loadAndRenderGrid();
  }

  function loadAndRenderGrid() {
    /* stations ไม่ได้ขึ้นกับ cal เลยยิงคู่กันได้ — เดิมซ้อนอยู่ใน .then() ของ cal ทำให้
       ต้องรอ round trip นึงจบก่อนค่อยยิงอีกอัน (เพิ่ม latency โดยไม่จำเป็น) */
    var stationsP = cachedGsRun('stations_' + current.year + '_' + current.month, 60000, 'api_getStationsForMonth', Session.token, current.year, current.month);
    /* วันลา (display-only) — ดึงขนานกับ cal เพื่อทาพื้นเทาช่องวันลาในตาราง ไม่กระทบ logic จัดเวร */
    var availP = cachedGsRun(ymKey('av'), 15000, 'api_listAvailability', Session.token, current.year, current.month);
    Promise.all([loadCalendarCached(), availP]).then(function (res) {
      var cal = res[0];
      leaveMap = {};
      /* เก็บ 'ชนิด' ของวันลาไว้เลย (full/AM/PM) เพื่อให้ช่องในกริดวาดลายต่างกันได้
         — เดิมเก็บแค่ true จึงแยกลาเต็มวันกับลาครึ่งวันไม่ออก */
      (res[1] || []).forEach(function (r) {
        var kind = LEAVE_KIND_[r.type];
        if (!kind) return;
        (leaveMap[r.pid] = leaveMap[r.pid] || {})[r.day] = kind;
      });
      calendarData = cal;
      peopleCache = cal.people;
      shiftTimesCfg = cal.shiftTimes || {};
      renderLegend();
      renderGridTable(calendarData);
      renderViolations(calendarData.ruleViolations);
      stationsP.then(function (stations) {
        renderContacts(calendarData.people, stations);
      });
      renderOvrLog(calendarData.overrides, calendarData.people);
      var N = calendarData.N;
      var nW = 0, nH = (calendarData.holidays || []).length;
      for (var d = 1; d <= N; d++) if (!isWknd(current.year, current.month, d) && !isHolD(d)) nW++;
      /* swatch เล็กๆ อธิบายสัญลักษณ์ "วันหยุด"/"ลา" ต่อท้ายบรรทัดสรุป — แสดงเฉพาะบนจอ
         ตอนพิมพ์ซ่อนทั้งชุดตามฟีดแบ็ก (ดู #gridSub .gridsub-key ใน @media print)
         ต้องห่อด้วย .gridsub-key ทั้งก้อน เพราะข้อความ "วันหยุด"/"ลา" เป็น text node เปล่า
         ถ้าซ่อนแค่ .mini-swatch จะเหลือคำลอยค้างอยู่ */
      document.getElementById('gridSub').innerHTML = 'วันราชการ ' + nW + ' · วันหยุด ' + (N - nW) + ' · นักขัตฤกษ์ ' + nH + ' วัน' +
        '<span class="gridsub-key">' +
        ' &nbsp; <span class="mini-swatch mini-swatch-holi"></span> วันหยุด' +
        ' &nbsp; <span class="mini-swatch mini-swatch-lv"></span> ลา</span>';
      var badge = document.getElementById('statusBadge');
      var map = { draft: ['draft', 'ดราฟต์ (รอตรวจสอบ)'], published: ['pub', 'ประกาศใช้แล้ว'], none: ['none', 'ยังไม่สร้าง'] };
      var m = map[calendarData.status] || map.none;
      badge.innerHTML = '<span class="badge ' + m[0] + '">' + m[1] + '</span>';
      renderPrintSign();
      renderWorkHoursPrint();
    });
  }

  function renderPrintSign() {
    var s = Session.settings || {};
    var el = document.getElementById('printSign');
    if (!el) return;
    el.innerHTML = '<div class="appr-col">' +
      '<div>เรียนผู้อำนวยการ' + (s.hosp || '') + '</div>' +
      '<div>เพื่อโปรดพิจารณาอนุมัติ</div>' +
      '<div class="appr-sig">..................................................</div>' +
      '<div>(' + (s.signH || '') + ')</div><div>' + (s.signHT || '') + '</div>' +
      '</div>' +
      '<div class="appr-col appr-col-r">' +
      '<div>คำสั่ง</div><div>อนุมัติ</div>' +
      '<div class="appr-sig">..................................................</div>' +
      '<div>(' + (s.signD || '') + ')</div><div>' + (s.signDT || '') + '</div>' +
      '</div>';
  }

  /* ตารางสรุปเวลาในการปฏิบัติงาน — แสดงเฉพาะตอนพิมพ์ (ported per attached sample sheet)
     เวลาแสดงแบบเต็ม เช่น 08.00-16.00 ตามฟีดแบ็ก (ไม่ใช่แบบย่อ 08-16) */
  /* ค่าเริ่มต้นเวลาปฏิบัติงาน — ค่าจริงมาจาก settings.shiftTimes (ตั้งค่า > เวลาปฏิบัติงานแต่ละเวร)
     เวร ด ไม่ให้แก้ เพราะแบ่งเป็น 2 ช่วงอัตราตายตัวตามระเบียบ (00.00-04.00 / 04.01-08.00) */
  var WORK_HOURS_FULL_ = { ch: { s: '08.00', e: '16.00' }, b1: { s: '16.00', e: '20.00' }, b: { s: '16.00', e: '00.00' }, d: { s: '00.00', e: '08.00' }, n: { s: '07.00', e: '08.00' } };
  var EDITABLE_SHIFT_TIMES_ = ['ch', 'b1', 'b', 'n'];
  /* เวลาที่ตั้งไว้ของเดือนที่กำลังดู — โหลดมาพร้อม calendar/setup bundle แล้วใช้ทั้งกริดและการ์ดพิมพ์ */
  var shiftTimesCfg = {};
  function shiftTime_(key) {
    var def = WORK_HOURS_FULL_[key] || { s: '', e: '' };
    var cfg = shiftTimesCfg[key] || {};
    return { s: cfg.s || def.s, e: cfg.e || def.e };
  }
  /* ชื่อเวรพร้อมช่วงเวลาปัจจุบัน เช่น "เวรคลินิกนอกเวลา 07-08" — ใช้แทน SHIFT_DEFS[id].name ตรงๆ
     เพื่อให้ legend/dropdown/การ์ดพิมพ์ เปลี่ยนตามเวลาที่ตั้งไว้ */
  function renderLegend() {
    var el = document.getElementById('legend');
    if (!el) return;
    el.innerHTML = Object.keys(SHIFT_DEFS).map(function (k) {
      return '<span>' + tokEl(k) + ' ' + shiftNameT_(k) + '</span>';
    }).join('') +
      '<span><span class="tok lv-swatch">&nbsp;&nbsp;</span> ลาทั้งวัน</span>' +
      '<span><span class="tok lv-swatch-am">&nbsp;&nbsp;</span> ลาครึ่งวันเช้า</span>' +
      '<span><span class="tok lv-swatch-pm">&nbsp;&nbsp;</span> ลาครึ่งวันบ่าย</span>';
  }

  function shiftNameT_(id) {
    var base = (SHIFT_DEFS[id] || {}).name || id;
    if (EDITABLE_SHIFT_TIMES_.indexOf(id) === -1) return base;
    var t = shiftTime_(id);
    return base.replace(/\s*\d{2}[.:]?\d{0,2}\s*-\s*\d{2}[.:]?\d{0,2}$/, '') +
      ' ' + t.s.replace('.00', '') + '-' + t.e.replace('.00', '');
  }
  function renderWorkHoursPrint() {
    var el = document.getElementById('workHoursPrint');
    if (!el) return;
    var order = ['ch', 'b1', 'b', 'd', 'n'];
    var rows = [];
    order.forEach(function (k) {
      if (k === 'd') {
        /* เวรดึก on call แยกแสดง 2 ช่วงเวลาตามอัตราจริง (325 บาทต่อช่วง) แทนที่จะโชว์รวดเดียว
           00.00-08.00 น. — ให้ตรงกับที่ใบเบิกเงินรวมคิดเงินจริงตามฟีดแบ็ก */
        var dLabel = SHIFT_DEFS.d.short + ' เวรดึก on call<span class="money-only"> (325 บาท)</span>';
        rows.push('<div class="whr-row"><span class="whr-lbl">' + dLabel + '</span><span class="whr-time">ตั้งแต่เวลา 00.00 น.-04.00 น.</span></div>');
        rows.push('<div class="whr-row"><span class="whr-lbl">' + dLabel + '</span><span class="whr-time">ตั้งแต่เวลา 04.01 น.-08.00 น.</span></div>');
        return;
      }
      var s = SHIFT_DEFS[k];
      var short = k === 'n' ? 'X' : (s.u ? '<u>' + s.short + '</u>' : s.short);
      var label = s.name.replace(/\s*\d+-\d+$/, '');
      if (label.indexOf(short) !== 0) label = short + ' ' + label;
      var t = shiftTime_(k);
      rows.push('<div class="whr-row"><span class="whr-lbl">' + label + '</span><span class="whr-time">ตั้งแต่เวลา ' + t.s + ' น.-' + t.e + ' น.</span></div>');
    });
    el.innerHTML = '<div class="card-title">เวลาในการปฏิบัติงาน</div>' +
      '<div class="whr-list">' + rows.join('') + '</div>' +
      '<div class="whr-row" style="margin-top:4px;font-size:11px;color:var(--mut)">* = มีบันทึก on call ปฏิบัติงานในวันนั้น</div>';
  }

  /* วันลาที่วาดลายบนกริด — ลาครึ่งวันวาดลายครึ่งช่องเพื่อให้เห็นว่าลาช่วงไหน
     (ชนิดอื่นเช่น noB/noD เป็นแค่ "ไม่สะดวก" ไม่ใช่วันลา จึงไม่วาดลาย) */
  var LEAVE_KIND_ = { leave: 'full', leaveAM: 'am', leavePM: 'pm' };
  var LEAVE_CLASS_ = { full: 'lv', am: 'lv-am', pm: 'lv-pm' };

  function isHolD(d) { return (calendarData.holidays || []).some(function (h) { return h.day === d; }); }
  function dowCls(d) { return isHolD(d) ? 'holi' : (isWknd(current.year, current.month, d) ? 'wknd' : ''); }

  /* เรียงตามเวลาเริ่มเวรจริง: ด (ต่อเนื่องจากเมื่อคืน จบ 08:00) · น 07-08 · ช 08-16 · บ1 16-20 · บ 16-00 */
  var TOK_TIME_ORDER = { d: 0, n: 1, ch: 2, b1: 3, b: 4 };
  function cellToks(p, d, cal) {
    var t = [];
    var a = cal.assign[d] || {};
    if ((a.ch || []).indexOf(p.id) > -1 && (isHolD(d) || isWknd(current.year, current.month, d))) t.push('ch');
    if ((a.b || []).indexOf(p.id) > -1) t.push('b');
    var prevA = cal.assign[d - 1];
    if (prevA && (prevA.d || []).indexOf(p.id) > -1) t.push('d');
    if ((cal.clinicMt[d] || []).indexOf(p.id) > -1 || (cal.clinicLa[d] || []).indexOf(p.id) > -1) t.push('n');
    if ((cal.laB[d] || []).indexOf(p.id) > -1) t.push('b1');
    t.sort(function (x, y) { return TOK_TIME_ORDER[x] - TOK_TIME_ORDER[y]; });
    return t;
  }

  /* มีบันทึก on call จริง (คนไข้/HN/LAB) ในวันนี้ไหม — ต่างจากแค่ "อยู่เวรดึกตามตาราง" (cellToks 'd')
     เทียบวันแบบเดียวกับ ocDayOf() ที่ใช้ในแท็บ on-call (ไม่ต้องเลื่อนวันเหมือน assign.d เพราะ o.date
     บันทึกเป็นวันที่ปฏิบัติจริงของ record นั้นอยู่แล้ว ตรงกับวันที่ 'ด' แสดงผลบนกริดพอดี) */
  function hasOncallRecord(p, d, cal) {
    return (cal.oncall || []).some(function (o) {
      if (o.pid !== p.id) return false;
      var dt = new Date(o.date);
      return dt.getFullYear() === cal.year - 543 && dt.getMonth() === cal.month && dt.getDate() === d;
    });
  }

  function fullN(p) { return (p.pfx || '') + p.name; }
  /* ชื่อในตารางเวร (คอลัมน์ ชื่อ-สกุล) เท่านั้น — ตัดคำนำหน้า (ทนพญ./ทนพ./นาย/นาง) ออกตามฟีดแบ็ก
     ที่อื่น (การ์ดติดต่อ/รายงาน/ลงนาม/dropdown) ยังใช้ fullN() แบบมีคำนำหน้าเหมือนเดิม */
  function gridN_(p) { return p.name; }

  function renderGridTable(cal) {
    var dl = dowLabel();
    var r1 = '<th class="nm" rowspan="2">ชื่อ-สกุล</th>', r2 = '';
    for (var d = 1; d <= cal.N; d++) {
      var c = dowCls(d);
      r1 += '<th class="dnum ' + c + '">' + d + '</th>';
      r2 += '<th class="dow ' + c + '">' + dl[new Date(cal.year - 543, cal.month, d).getDay()] + '</th>';
    }
    r1 += '<th class="sumcol" rowspan="2">x</th><th class="sumcol" rowspan="2">ช</th><th class="sumcol" rowspan="2"><u>บ</u></th><th class="sumcol" rowspan="2">บ</th><th class="sumcol" rowspan="2">ด</th><th class="sumcol" rowspan="2">รวม</th>';
    var h = '<thead><tr>' + r1 + '</tr><tr>' + r2 + '</tr></thead><tbody>';

    var totals = { ch: 0, b: 0, b1: 0, n: 0, d: 0 };
    cal.people.forEach(function (p) {
      var sums = { ch: 0, b: 0, b1: 0, n: 0, d: 0 };
      var row = '<tr><td class="nm">' + gridN_(p) + '</td>';
      for (var d2 = 1; d2 <= cal.N; d2++) {
        var toks = cellToks(p, d2, cal);
        toks.forEach(function (t) { sums[t] = (sums[t] || 0) + 1; });
        var ovrd = (cal.overrides || []).some(function (o) {
          if ((o.aff || []).indexOf(p.id) === -1) return false;
          return (o.shift === 'd' ? o.day + 1 : o.day) === d2;
        });
        var leaveKind = leaveMap[p.id] && leaveMap[p.id][d2];
        var onLeave = leaveKind ? ' ' + LEAVE_CLASS_[leaveKind] : '';
        /* ด (เวรดึก on call) ใส่เครื่องหมาย * ต่อท้ายเฉพาะวันที่มีบันทึก on call จริง (คนไข้/HN/LAB)
           ต่างจากแค่ถูกจัดตารางไว้เฉยๆ — ช่วยแยกว่าวันไหน "อยู่เวร" กับวันไหน "มีคนไข้จริง" */
        var cellHtml = toks.map(function (t) {
          if (t === 'd') return tokEl('d', hasOncallRecord(p, d2, cal) ? '*' : '');
          return tokEl(t);
        }).join('');
        row += '<td class="' + dowCls(d2) + onLeave + '"><div class="cell' + (ovrd ? ' ovrd' : '') + '" data-day="' + d2 + '" data-pid="' + p.id + '">' + cellHtml + '</div></td>';
      }
      var isLA = p.role === 'LA';
      var rmt = isLA ? sums.ch + sums.b1 : sums.ch + sums.b;
      row += '<td class="sumcol">' + sums.n + '</td><td class="sumcol">' + sums.ch + '</td><td class="sumcol">' + sums.b1 + '</td><td class="sumcol">' + sums.b + '</td><td class="sumcol">' + sums.d + '</td><td class="sumcol" style="font-size:12px">' + rmt + '</td></tr>';
      h += row;
      ['ch', 'b', 'b1', 'n', 'd'].forEach(function (t) { totals[t] += sums[t] || 0; });
    });
    h += '<tr class="sum-row"><td class="nm" style="text-align:right;font-size:11px;color:var(--mut)">รวมทั้งหมด</td>';
    for (var d3 = 1; d3 <= cal.N; d3++) h += '<td></td>';
    h += '<td class="sumcol">' + totals.n + '</td><td class="sumcol">' + totals.ch + '</td><td class="sumcol">' + totals.b1 + '</td><td class="sumcol">' + totals.b + '</td><td class="sumcol">' + totals.d + '</td><td class="sumcol">—</td></tr></tbody>';

    var table = document.getElementById('schedTbl');
    table.innerHTML = h;
    table.onclick = function (e) {
      var cell = e.target.closest('[data-day]');
      if (cell && Session.permissions.override) openOvr(+cell.dataset.day, cell.dataset.pid, cal);
    };
  }

  var VIOLATION_LABEL = {
    maxC: 'เวรติดต่อกันเกินกำหนด',
    d_n_overlap: 'เวร ด/น ซ้อนกัน',
    fri_block_split: 'แยกคนละกันวันศุกร์-เสาร์'
  };
  var OVR_TYPE_LABEL = {
    'manual-override': 'แก้ไขด้วยตนเอง',
    'manual-remove': 'เอาเวรออก',
    'manual-swap': 'สลับเวร',
    'balance-swap': 'สลับสมดุลอัตโนมัติ',
    'cross-month-unlock': 'ปลดล็อกข้ามเดือน'
  };
  function renderViolations(violations) {
    var panel = document.getElementById('violationsPanel');
    if (!violations.length) { panel.innerHTML = ''; return; }
    panel.innerHTML = '<div class="card"><div class="card-title"><i class="ti ti-alert-triangle"></i>สมดุลเวร / ข้อควรตรวจสอบ (' + violations.length + ')</div>' +
      violations.map(function (v) {
        return '<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;"><span class="badge ' + (v.severity === 'warn' ? 'warn' : 'ok') + '">' + (VIOLATION_LABEL[v.type] || v.type) + '</span> ' + v.msg + '</div>';
      }).join('') + '</div>';
  }

  function renderContacts(people, stations) {
    var stationOf = {};
    (stations || []).forEach(function (s) {
      (s.assigned || []).forEach(function (pid) {
        stationOf[pid] = stationOf[pid] ? stationOf[pid] + ', ' + s.name : s.name;
      });
    });
    document.getElementById('contactGrid').innerHTML = people.filter(function (p) { return p.active !== false; }).map(function (p) {
      return '<div class="contact"><div class="cn">' + fullN(p) + '</div><div class="cp">' + (p.title || '') + '</div>' +
        (stationOf[p.id] ? '<div class="cp" style="color:var(--tl);"><i class="ti ti-map-pin"></i> ' + stationOf[p.id] + '</div>' : '') +
        '<div class="cc">' + (p.phone ? '<i class="ti ti-phone"></i> ' + p.phone : '<span style="color:var(--mut)">ไม่มีเบอร์โทร</span>') + '</div></div>';
    }).join('');
  }

  /* สถานะย่อ/ขยาย Override Log — ค่าเริ่มต้นย่อ จำไว้ระหว่างการ re-render ในหน้าเดียวกัน */
  var _ovrLogOpen = false;
  function renderOvrLog(overrides, people) {
    var card = document.getElementById('ovrLogCard');
    if (!overrides || !overrides.length) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    document.getElementById('ovrLogCount').textContent = overrides.length + ' รายการ';
    var wrap = document.getElementById('ovrLogWrap'), chev = document.getElementById('ovrLogChev');
    var paintOvrLog = function () {
      wrap.style.display = _ovrLogOpen ? 'block' : 'none';
      chev.className = 'ti ' + (_ovrLogOpen ? 'ti-chevron-up' : 'ti-chevron-down');
    };
    paintOvrLog();
    document.getElementById('ovrLogHead').onclick = function () { _ovrLogOpen = !_ovrLogOpen; paintOvrLog(); };
    var byId = {}; people.forEach(function (p) { byId[p.id] = p; });
    document.getElementById('ovrLogTbl').innerHTML = '<tr><th>เวลา</th><th>วันที่</th><th>ประเภท</th><th>การเปลี่ยนแปลง</th></tr>' +
      overrides.slice().reverse().map(function (o) {
        var t = o.time ? new Date(o.time).toLocaleString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '';
        var change = o.from && o.to ? ((byId[o.from] ? byId[o.from].short || byId[o.from].name : o.from) + ' → ' + (byId[o.to] ? byId[o.to].short || byId[o.to].name : o.to)) : (o.shiftLabel || o.reason || '');
        var dispDay = o.shift === 'd' ? o.day + 1 : o.day;
        return '<tr><td>' + t + '</td><td>วันที่ ' + dispDay + '</td><td><span class="badge none">' + (OVR_TYPE_LABEL[o.type] || o.type || 'override') + '</span></td><td class="l">' + change + '</td></tr>';
      }).join('');
  }

  /* ── manual override modal (ported from openOvr()/applyOvr()) ── */
  var OVR_SHIFT_OPTS = [
    ['ch', 'เวรเช้า (วันหยุด)'], ['b', 'เวรบ่าย'], ['d', 'เวรดึก On call'],
    ['n_mt', 'เวรคลินิกนอกเวลา (MT)'], ['n_la', 'เวรคลินิกนอกเวลา (LA)'], ['b1', '<u>บ</u> เวรเสริมบ่าย']
  ];
  var OVR_SHIFT_LABEL_ = {}; OVR_SHIFT_OPTS.forEach(function (o) { OVR_SHIFT_LABEL_[o[0]] = o[1]; });
  var OVR_BLOCK_PRESETS = [
    { id: '', label: '(เลือกทีละเวร)', shifts: [] },
    { id: 'chbd', label: 'ทั้งก้อน ช+บ+ด', shifts: ['ch', 'b', 'd'] },
    { id: 'bd', label: 'ทั้งก้อน บ+ด', shifts: ['b', 'd'] }
  ];
  /* เวร "d" ต่อเนื่องจากเมื่อคืน จบ 08:00 — cellToks() จึงแสดงผลของ assign[day-1].d ไว้ในช่องวันที่ day
     (ดูคอมเมนต์ cellToks ด้านบน) ตอน override ต้องเขียนย้อนกลับไปที่ day-1 ให้ตรงกับสิ่งที่มองเห็นจริง
     ไม่งั้นจะกลายเป็นบั๊ก "ต้องคลิกวันก่อนหน้าถึงจะย้ายเวรที่เห็น" */
  function ovrStorageDay_(day, shift) { return shift === 'd' ? day - 1 : day; }
  /** ใครอยู่เวรนี้อยู่แล้ว (รองรับหลายคนต่อ 1 เวร/1 วัน) — เวร 'd' ใช้ offset เดียวกับ ovrStorageDay_
   *  (แสดงคนของ "เมื่อคืน" ให้ตรงกับที่เห็นในตาราง) */
  function currentOccupants_(cal, day, shift) {
    var map = {
      ch: (cal.assign[day] || {}).ch, b: (cal.assign[day] || {}).b, d: (cal.assign[day - 1] || {}).d,
      n_mt: cal.clinicMt[day], n_la: cal.clinicLa[day], b1: cal.laB[day]
    };
    return map[shift] || [];
  }
  function openOvr(day, pid, cal) {
    loadPeople().then(function (people) {
      var byId = {}; people.forEach(function (p) { byId[p.id] = p; });
      var clickedName = byId[pid] ? fullN(byId[pid]) : '';
      var opts = people.map(function (p) { return '<option value="' + p.id + '"' + (p.id === pid ? ' selected' : '') + '>' + fullN(p) + '</option>'; }).join('');
      var body = document.createElement('div');
      body.innerHTML = '<div class="alert" style="background:var(--coral-l);border-color:var(--coral);color:var(--coral);"><i class="ti ti-alert-triangle"></i> Override ยกเว้นกฎทั้งหมด · บันทึก Log ทันที · เวรเดียวกันมีได้หลายคนพร้อมกัน</div>' +
        '<div class="oc-form-grid" style="grid-template-columns:1fr 1fr;">' +
        '<label style="grid-column:1/-1;">ย้ายเป็นก้อน<select id="ovrPreset">' + OVR_BLOCK_PRESETS.map(function (p) { return '<option value="' + p.id + '">' + p.label + '</option>'; }).join('') + '</select></label>' +
        '<label style="grid-column:1/-1;">ประเภทเวร (เลือกได้หลายเวร)<div id="ovrShiftChips" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">' +
        OVR_SHIFT_OPTS.map(function (o) {
          var occ = currentOccupants_(cal, day, o[0]).map(function (oid) { return byId[oid] ? fullN(byId[oid]) : oid; });
          return '<label style="display:flex;align-items:center;gap:4px;font-size:12.5px;border:1px solid var(--border);border-radius:7px;padding:4px 8px;cursor:pointer;"><input type="checkbox" value="' + o[0] + '" class="ovrShiftChk"> ' + o[1] +
            ' <span style="color:var(--mut);font-size:11px;">(ปัจจุบัน: ' + (occ.length ? occ.join(', ') : 'ว่าง') + ')</span></label>';
        }).join('') +
        '</div></label>' +
        '<label>มอบเวรให้ (ใช้กับปุ่ม "เพิ่มเวร"/"สลับเวร")<select id="ovrPid">' + opts + '</select></label>' +
        '<label style="grid-column:1/-1;">เหตุผล<textarea id="ovrReason" rows="2" style="border:1px solid var(--border);border-radius:7px;padding:6px;"></textarea></label></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">' +
        '<button class="btn btn-danger btn-sm" id="ovrRemoveBtn"><i class="ti ti-minus"></i> เอาเวรออก' + (clickedName ? (' จาก ' + clickedName) : '') + '</button>' +
        '<button class="btn btn-sm" id="ovrSwapBtn"><i class="ti ti-arrows-right-left"></i> สลับเวร</button>' +
        '<button class="btn btn-primary btn-sm" id="ovrAddBtn"><i class="ti ti-plus"></i> เพิ่มเวร</button>' +
        '</div>';
      body.querySelector('#ovrPreset').onchange = function (e) {
        var preset = OVR_BLOCK_PRESETS.filter(function (p) { return p.id === e.target.value; })[0];
        body.querySelectorAll('.ovrShiftChk').forEach(function (chk) { chk.checked = preset.shifts.indexOf(chk.value) > -1; });
      };
      function pickedShifts() {
        var shifts = Array.prototype.slice.call(body.querySelectorAll('.ovrShiftChk:checked')).map(function (c) { return c.value; });
        if (!shifts.length) toast('กรุณาเลือกประเภทเวรอย่างน้อย 1 เวร', '', true);
        return shifts;
      }
      function submit(shifts, buildEntry, successMsg) {
        var crossMonth = false;
        var calls = shifts.map(function (shift) {
          var storageDay = ovrStorageDay_(day, shift);
          if (storageDay < 1) { crossMonth = true; return null; }
          return gsRun('api_addOverride', Session.token, current.year, current.month, buildEntry(shift, storageDay));
        }).filter(Boolean);
        if (crossMonth) toast('เวร ด ของวันที่ 1 เป็นเวรข้ามเดือนจากเดือนก่อน กรุณาแก้ไขที่ตารางเดือนก่อนหน้าแทน', '', true);
        if (!calls.length) { if (!crossMonth) closeModal(); return; }
        Promise.all(calls).then(function () {
          invalidateMonthCache();
          toast(successMsg + ' (' + calls.length + ' เวร)'); closeModal(); loadAndRenderGrid();
        }).catch(function () { closeModal(); });
      }
      body.querySelector('#ovrAddBtn').onclick = function () {
        var shifts = pickedShifts(); if (!shifts.length) return;
        var toPid = document.getElementById('ovrPid').value;
        var toName = byId[toPid] ? fullN(byId[toPid]) : toPid;
        var reason = document.getElementById('ovrReason').value;
        submit(shifts, function (shift, storageDay) {
          return {
            day: storageDay, type: 'manual-override', shift: shift, to: toPid, from: null,
            reason: reason, time: new Date().toISOString(), aff: [toPid],
            shiftLabel: 'เพิ่ม ' + toName + ' เข้าเวร ' + (OVR_SHIFT_LABEL_[shift] || shift)
          };
        }, 'บันทึก Override แล้ว');
      };
      body.querySelector('#ovrSwapBtn').onclick = function () {
        var shifts = pickedShifts(); if (!shifts.length) return;
        var toPid = document.getElementById('ovrPid').value;
        if (toPid === pid) { toast('เลือกคนอื่นให้ต่างจากคนที่คลิก', '', true); return; }
        var reason = document.getElementById('ovrReason').value;
        submit(shifts, function (shift, storageDay) {
          return {
            day: storageDay, type: 'manual-swap', shift: shift, to: toPid, from: pid,
            reason: reason, time: new Date().toISOString(), aff: [pid, toPid]
          };
        }, 'สลับเวรแล้ว');
      };
      body.querySelector('#ovrRemoveBtn').onclick = function () {
        var shifts = pickedShifts(); if (!shifts.length) return;
        var reason = document.getElementById('ovrReason').value;
        submit(shifts, function (shift, storageDay) {
          return {
            day: storageDay, type: 'manual-remove', shift: shift, to: null, from: pid,
            reason: reason, time: new Date().toISOString(), aff: [pid],
            shiftLabel: 'เอา ' + clickedName + ' ออกจากเวร ' + (OVR_SHIFT_LABEL_[shift] || shift)
          };
        }, 'เอาเวรออกแล้ว');
      };
      showModal('จัดการเวร — วันที่ ' + day + ' ' + monthLabel(), body, false);
    });
  }

  /* ════════════════ DASH — รีดีไซน์: KPI แถวเดียว + กราฟ Chart.js รวมข้อมูลเวรและสถิติ on-call ════════════════
     ข้อมูลที่เคยซ้ำกัน (แถบภาระงาน + การ์ดตามบทบาท + การ์ดรายบุคคล แสดงตัวเลขชุดเดียวกัน 3 ที่)
     ถูกยุบเหลือกราฟแท่งซ้อนอันเดียว แยกสีตามประเภทเวร + ระบุบทบาทในชื่อ ส่วนสถิติ on-call
     (ช่วงเวลา/LAB/หน่วยงาน/รายวัน/รายชั่วโมง) ดึงจาก cal.oncall ที่มีอยู่แล้วมาแสดงเป็นกราฟ */

  var _dashCharts = [];
  function _mkChart(id, cfg) {
    var el = document.getElementById(id);
    if (!el || typeof Chart === 'undefined') return;
    _dashCharts.push(new Chart(el.getContext('2d'), cfg));
  }

  /* destroy กราฟชุดเก่าก่อนวาดใหม่ทุกครั้ง — ทั้งตอน render หน้าใหม่ (canvas เดิมถูกแทนด้วย innerHTML ใหม่
     Chart.js จะถือ reference + resize observer ค้างไว้ = รั่ว) และตอนวาดซ้ำด้วยข้อมูลสดจาก SWR
     (Chart.js ไม่ยอมให้สร้างกราฟบน canvas ที่ยังมีกราฟเก่าอยู่ — "Canvas is already in use") */
  function _destroyDashCharts() {
    _dashCharts.forEach(function (c) { try { c.destroy(); } catch (e) { } });
    _dashCharts = [];
  }

  function renderSchedDashPage(page) {
    _destroyDashCharts();

    function card(title, icon, id, h) {
      return '<div class="card"><div class="card-title"><i class="ti ' + icon + '"></i>' + title + '</div>' +
        '<div id="' + id + 'Wrap" style="position:relative;height:' + h + 'px"><canvas id="' + id + '"></canvas></div></div>';
    }
    page.innerHTML = '<h2 style="margin:0 0 10px;font-size:16px;">แดชบอร์ดตารางเวร — ' + monthLabel() + '</h2>' +
      '<div class="stat-grid" id="schedStatGrid"></div>' +
      '<div class="two-col">' +
      card('สัดส่วนเวรตามประเภท (ทั้งทีม)', 'ti-chart-pie', 'dashShiftMix', 210) +
      card('หน่วยงานที่ส่งตรวจ on call', 'ti-building-hospital', 'dashUnits', 210) +
      '</div>' +
      card('ภาระงานรายบุคคล แยกตามประเภทเวร', 'ti-chart-bar', 'dashPeople', 280) +
      '<div class="two-col">' +
      card('LAB ที่ตรวจบ่อย (on call)', 'ti-flask', 'dashLabs', 250) +
      card('เวลาบันทึก on call รายชั่วโมง', 'ti-clock', 'dashHours', 250) +
      '</div>' +
      card('จำนวนราย on call รายวัน แยกช่วงเวลา', 'ti-calendar-stats', 'dashDaily', 210);

    function paintDash(cal, workload) {
        _destroyDashCharts(); /* วาดซ้ำได้ (cache ก่อน แล้วข้อมูลสดตามมา) */
        var N = cal.N;
        var SHIFT_DEFS = [
          { k: 'ch', label: 'เวรเช้า (ช)', color: '#138577' },
          { k: 'b', label: 'เวรบ่าย (บ)', color: '#2059A8' },
          { k: 'b1', label: 'เวรเสริมบ่าย (บ1)', color: '#6845AA' },
          { k: 'n', label: 'คลินิก (น)', color: '#B8862E' },
          { k: 'd', label: 'เวรดึก (ด)', color: '#C0432B' }
        ];
        function noData(id) { document.getElementById(id + 'Wrap').innerHTML = '<div style="color:var(--mut);font-size:12.5px;padding:16px 0">ยังไม่มีข้อมูล on call เดือนนี้</div>'; }

        /* ── on-call ของเดือนนี้ (cal.oncall = OnCallRecords เต็ม มี date/time/hn/labs/unit อยู่แล้ว) ── */
        function ocDayOf(o) {
          var dt = new Date(o.date);
          return (dt.getFullYear() === current.year - 543 && dt.getMonth() === current.month) ? dt.getDate() : null;
        }
        var ocList = (cal.oncall || []).filter(function (o) { return ocDayOf(o); });
        var hnSet = {}, nightSet = {}, totalLabs = 0;
        ocList.forEach(function (o) {
          if (o.hn) hnSet[o.hn] = true;
          nightSet[ocDayOf(o)] = true;
          totalLabs += (o.labs || []).length;
        });

        /* ── KPI แถวเดียว: ปฏิทิน + on-call รวมกัน (เดิมแยกกระจัดกระจาย) ── */
        var nW = 0;
        for (var d = 1; d <= N; d++) if (!isWknd(current.year, current.month, d) && !(cal.holidays || []).some(function (h) { return h.day === d; })) nW++;
        var stats = [
          { lbl: 'วันราชการ', val: nW }, { lbl: 'วันหยุด+นักขัตฤกษ์', val: N - nW },
          { lbl: 'On Call (ราย)', val: ocList.length }, { lbl: 'คืนที่มีตรวจ', val: Object.keys(nightSet).length },
          { lbl: 'ผู้ป่วยไม่ซ้ำ (HN)', val: Object.keys(hnSet).length }, { lbl: 'รายการ LAB', val: totalLabs }
        ];
        document.getElementById('schedStatGrid').innerHTML = stats.map(function (s) {
          return '<div class="stat"><div class="val">' + s.val + '</div><div class="lbl">' + s.lbl + '</div></div>';
        }).join('');

        /* ── 1. โดนัทสัดส่วนเวรทั้งทีม ── */
        var shiftTotals = SHIFT_DEFS.map(function (s) {
          var t = 0;
          workload.people.forEach(function (p) { t += (((workload.byPerson[p.id] || {})[s.k]) || []).length; });
          return t;
        });
        _mkChart('dashShiftMix', {
          type: 'doughnut',
          data: { labels: SHIFT_DEFS.map(function (s) { return s.label; }), datasets: [{ data: shiftTotals, backgroundColor: SHIFT_DEFS.map(function (s) { return s.color; }), borderWidth: 0 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
        });

        /* ── 2. โดนัทหน่วยงานที่ส่งตรวจ ── */
        var PALETTE = ['#0E6158', '#B8862E', '#2059A8', '#C0432B', '#6845AA', '#1E7D4F', '#7A827D'];
        if (!ocList.length) { noData('dashUnits'); } else {
          var unitCounts = {};
          ocList.forEach(function (o) { var u = String(o.unit || 'ไม่ระบุ').trim() || 'ไม่ระบุ'; unitCounts[u] = (unitCounts[u] || 0) + 1; });
          var unitKeys = Object.keys(unitCounts).sort(function (a, b) { return unitCounts[b] - unitCounts[a]; });
          _mkChart('dashUnits', {
            type: 'doughnut',
            data: { labels: unitKeys, datasets: [{ data: unitKeys.map(function (k) { return unitCounts[k]; }), backgroundColor: unitKeys.map(function (k, i) { return PALETTE[i % PALETTE.length]; }), borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
          });
        }

        /* ── 3. แท่งซ้อนภาระงานรายบุคคล (ยุบแถบ+การ์ดบทบาท+การ์ดรายบุคคลเดิม) ── */
        var oncallByPid = {};
        ocList.forEach(function (o) { oncallByPid[o.pid] = (oncallByPid[o.pid] || 0) + 1; });
        var pplLabels = workload.people.map(function (p) { return fullN(p) + ' (' + (p.role || 'MT') + ')'; });
        _mkChart('dashPeople', {
          type: 'bar',
          data: {
            labels: pplLabels,
            datasets: SHIFT_DEFS.map(function (s) {
              return { label: s.label, backgroundColor: s.color, data: workload.people.map(function (p) { return (((workload.byPerson[p.id] || {})[s.k]) || []).length; }) };
            })
          },
          options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            scales: { x: { stacked: true, title: { display: true, text: 'วัน' } }, y: { stacked: true } },
            plugins: {
              legend: { position: 'bottom' },
              tooltip: { callbacks: { footer: function (items) { var p = workload.people[items[0].dataIndex]; return 'on call ' + (oncallByPid[p.id] || 0) + ' ราย'; } } }
            }
          }
        });

        /* ── 4. LAB ที่ตรวจบ่อย (top 10) ── */
        if (!ocList.length) { noData('dashLabs'); } else {
          var labCounts = {};
          ocList.forEach(function (o) { (o.labs || []).forEach(function (lab) { var k = String(lab).trim(); if (k) labCounts[k] = (labCounts[k] || 0) + 1; }); });
          var labKeys = Object.keys(labCounts).sort(function (a, b) { return labCounts[b] - labCounts[a]; }).slice(0, 10);
          if (!labKeys.length) { noData('dashLabs'); } else {
            _mkChart('dashLabs', {
              type: 'bar',
              data: { labels: labKeys, datasets: [{ label: 'จำนวนครั้ง', data: labKeys.map(function (k) { return labCounts[k]; }), backgroundColor: '#138577' }] },
              options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { precision: 0 } } } }
            });
          }
        }

        /* ── 5. รายชั่วโมง — สีเข้ม/อ่อนตามช่วง 00.00-04.00 / 04.01-08.00 (รวมมิติช่วงเวลาเข้ามาในกราฟเดียว) ── */
        if (!ocList.length) { noData('dashHours'); } else {
          var hourCounts = {};
          ocList.forEach(function (o) {
            var hh = parseInt(String(o.time || '').replace('.', ':').split(':')[0], 10);
            if (!isNaN(hh)) hourCounts[hh] = (hourCounts[hh] || 0) + 1;
          });
          var hourKeys = Object.keys(hourCounts).map(Number).sort(function (a, b) { return a - b; });
          _mkChart('dashHours', {
            type: 'bar',
            data: {
              labels: hourKeys.map(function (hh) { return ('0' + hh).slice(-2) + ':00'; }),
              datasets: [{ label: 'จำนวนราย', data: hourKeys.map(function (hh) { return hourCounts[hh]; }), backgroundColor: hourKeys.map(function (hh) { return hh < 4 ? '#0E6158' : '#3BBDAA'; }) }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { footer: function (items) { return +String(items[0].label).split(':')[0] < 4 ? 'ช่วง 00.00-04.00' : 'ช่วง 04.01-08.00'; } } } }, scales: { y: { ticks: { precision: 0 } } } }
          });
        }

        /* ── 6. รายวันของเดือน ซ้อนตามช่วงเวลา ── */
        if (!ocList.length) { noData('dashDaily'); } else {
          var byDay = { d0: {}, d1: {} };
          ocList.forEach(function (o) {
            var hh = parseInt(String(o.time || '').replace('.', ':').split(':')[0], 10);
            var period = (!isNaN(hh) && hh < 4) ? 'd0' : 'd1';
            var dd = ocDayOf(o);
            byDay[period][dd] = (byDay[period][dd] || 0) + 1;
          });
          var dayLabels = [];
          for (var d5 = 1; d5 <= N; d5++) dayLabels.push(d5);
          _mkChart('dashDaily', {
            type: 'bar',
            data: {
              labels: dayLabels,
              datasets: [
                { label: '00.00-04.00', backgroundColor: '#0E6158', data: dayLabels.map(function (dd) { return byDay.d0[dd] || 0; }) },
                { label: '04.01-08.00', backgroundColor: '#3BBDAA', data: dayLabels.map(function (dd) { return byDay.d1[dd] || 0; }) }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, ticks: { precision: 0 } } }, plugins: { legend: { position: 'bottom' } } }
          });
        }
    }

    /* SWR: มีข้อมูลเดือนนี้ใน cache ครบทั้งคู่ก็วาดกราฟทันที (สลับแท็บกลับมาแล้วเห็นเลย)
       แล้วดึงข้อมูลจริงเบื้องหลังพร้อมกันทั้งสอง endpoint แล้ววาดทับรอบเดียว (ไม่กระพริบ) */
    var cal0 = cacheGet(ymKey('cal')), wl0 = cacheGet(ymKey('wl'));
    if (cal0 && wl0) paintDash(cal0, wl0);
    else document.getElementById('schedStatGrid').innerHTML = '<div style="color:var(--mut);font-size:12.5px;padding:6px 0"><i class="ti ti-loader-2 oc-spin"></i> กำลังโหลดข้อมูลแดชบอร์ด...</div>';

    Promise.all([
      gsRunBg('api_loadCalendar', Session.token, current.year, current.month),
      gsRunBg('api_calculateWorkload', Session.token, current.year, current.month)
    ]).then(function (r) {
      cachePut(ymKey('cal'), r[0]);
      cachePut(ymKey('wl'), r[1]);
      if (document.getElementById('schedStatGrid')) paintDash(r[0], r[1]); /* ยังอยู่หน้านี้อยู่ */
    }, function (err) {
      if (cal0 && wl0) return; /* ยังมีข้อมูลเดิมให้ดู ไม่ต้องรบกวน */
      var el = document.getElementById('schedStatGrid');
      if (el) {
        el.innerHTML = '<div style="color:var(--coral);font-size:12.5px;padding:6px 0">โหลดข้อมูลไม่สำเร็จ: ' +
          (err && err.message || err) + ' — <a href="#" id="dashRetry">ลองใหม่</a></div>';
        bindRetry_('dashRetry', function () { renderSchedDashPage(page); });
      }
    });
  }

  /* ════════════════ COLLECT — leave/availability (ported from renderCollect()/addAvail()) ════════════════ */

  function renderCollectPage(page) {
    page.innerHTML = '<h2 style="margin:0 0 10px;font-size:16px;">เก็บวันลา / ความไม่สะดวกขึ้นเวร — ' + monthLabel() + '</h2>' +
      '<div class="oc-form-grid">' +
      '<label>เจ้าหน้าที่<select id="avPid"></select></label>' +
      '<label>วันที่<input id="avDay" type="number" min="1" max="31"></label>' +
      '<label>ประเภท<select id="avType"><option value="leave">ลาทั้งวัน</option><option value="leaveAM">ลาครึ่งวันเช้า</option><option value="leavePM">ลาครึ่งวันบ่าย</option><option value="noB">ไม่สะดวกเวร บ</option><option value="noD">ไม่สะดวกเวร ด</option><option value="noCh">ไม่สะดวกเวร ช (วันหยุด)</option><option value="noN">ไม่สะดวกเวรคลินิกนอกเวลา (' + shiftTime_('n').s.replace('.00','') + '-' + shiftTime_('n').e.replace('.00','') + ')</option><option value="noB1">ไม่สะดวกเวรเสริมบ่าย (16-20)</option><option value="offAll">ไม่ขึ้นเวรทุกเวร (off)</option></select></label>' +
      '</div><button class="btn btn-primary" id="avAddBtn"><i class="ti ti-plus"></i> เพิ่มรายการ</button>' +
      '<div class="card" style="margin-top:14px;"><div class="card-title"><i class="ti ti-list"></i>รายการที่แจ้งไว้</div><div class="tbl-wrap"><table class="tbl" id="avTable"></table></div></div>';

    loadPeople().then(function (people) {
      /* แอดมินแจ้งแทนคนอื่นได้ — ที่เหลือล็อกเป็นชื่อตัวเองเท่านั้น (server บังคับ pid ซ้ำอีกชั้นใน api_addAvailability) */
      var avPidSel = document.getElementById('avPid');
      if (isAdmin_()) {
        avPidSel.innerHTML = people.map(function (p) { return '<option value="' + p.id + '">' + fullN(p) + '</option>'; }).join('');
        avPidSel.disabled = false;
      } else {
        var mine = people.filter(function (p) { return p.id === myPersonId_(); })[0];
        avPidSel.innerHTML = mine
          ? '<option value="' + mine.id + '">' + fullN(mine) + '</option>'
          : '<option value="">— บัญชีนี้ยังไม่ได้ผูกกับเจ้าหน้าที่ —</option>';
        avPidSel.disabled = true;
        document.getElementById('avAddBtn').disabled = !mine;
      }
    });

    document.getElementById('avAddBtn').onclick = function () {
      var btn = this;
      if (btn.disabled) return; /* กันกดซ้ำระหว่างรอผลบันทึก */
      var entry = { pid: document.getElementById('avPid').value, day: +document.getElementById('avDay').value, type: document.getElementById('avType').value, mon: current.month, yr: current.year };
      if (!entry.day) { toast('กรุณากรอกวันที่', 'ยังไม่ได้ระบุวันที่ที่ต้องการแจ้ง', true); document.getElementById('avDay').focus(); return; }
      var prevHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2 oc-spin"></i> กำลังบันทึก...';
      gsRun('api_addAvailability', Session.token, current.year, current.month, entry).then(function (resp) {
        toast('บันทึกแล้ว');
        document.getElementById('avDay').value = '';
        btn.disabled = false; btn.innerHTML = prevHtml;
        /* วาดรายการที่เซิร์ฟเวอร์ตอบรับแล้วลงตารางทันที ไม่ต้องรอ round trip ที่สอง
           แล้ว loadAvailTable() ที่ตามมา reconcile กับข้อมูลจริงให้เอง */
        cachePatchAndPaint_(avCacheKey(), function (rows) { rows.push(mergeObj_({ __txId: resp && resp.id }, entry)); }, renderAvTable);
        loadAvailTable();
      }, function () {
        btn.disabled = false; btn.innerHTML = prevHtml;
      });
    };
    loadAvailTable();
  }

  /* ── รายการวันลา/ความไม่สะดวก: SWR + วาดผลทันทีหลังเพิ่ม/ลบ (แบบเดียวกับหน้า on-call) ── */
  var AV_TBL_HEAD = '<tr><th>เจ้าหน้าที่</th><th>วันที่</th><th>ประเภท</th><th></th></tr>';
  var AV_TYPE_LABEL = { leave: 'ลาทั้งวัน', leaveAM: 'ลาครึ่งวันเช้า', leavePM: 'ลาครึ่งวันบ่าย', noB: 'ไม่สะดวก บ', noD: 'ไม่สะดวก ด', noCh: 'ไม่สะดวก ช', noN: 'ไม่สะดวก น', noB1: 'ไม่สะดวก <u>บ</u>', offAll: 'ไม่ขึ้นเวรทุกเวร (off)' };
  var avPeople_ = null; /* people ล่าสุด (loadPeople มี cache ในตัว จึงมักได้ทันที) */
  function avCacheKey() { return ymKey('av'); }

  function renderAvTable(rows) {
    var table = document.getElementById('avTable');
    if (!table || !avPeople_) return; /* ผู้ใช้สลับหน้าไปแล้ว หรือยังไม่ได้รายชื่อ */
    var byId = {}; avPeople_.forEach(function (p) { byId[p.id] = p; });
    var body = rows.slice().sort(function (a, b) { return a.day - b.day; }).map(function (r) {
      var p = byId[r.pid];
      /* เห็นรายการของทุกคนได้ แต่ลบได้แค่ของตัวเอง ยกเว้นแอดมิน */
      var actions = canEditRecord_(r.pid)
        ? '<button class="btn btn-sm btn-danger" data-del="' + r.__txId + '"><i class="ti ti-trash"></i></button>'
        : '<span style="color:var(--mut);font-size:11px;">—</span>';
      return '<tr><td class="l">' + (p ? fullN(p) : r.pid) + '</td><td>' + r.day + '</td><td><span class="badge none">' + (AV_TYPE_LABEL[r.type] || r.type) + '</span></td>' +
        '<td>' + actions + '</td></tr>';
    }).join('') || '<tr><td colspan="4" style="color:var(--mut)">ยังไม่มีรายการ</td></tr>';
    table.innerHTML = AV_TBL_HEAD + body;
    table.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.dataset.del;
        btn.disabled = true;
        btn.innerHTML = '<i class="ti ti-loader-2 oc-spin"></i>';
        gsRun('api_deleteAvailability', Session.token, current.year, current.month, id).then(function () {
          toast('ลบแล้ว');
          /* เอาแถวออกจากตารางทันที (เซิร์ฟเวอร์ลบแล้ว) แล้วค่อย reconcile เบื้องหลัง */
          cachePatchAndPaint_(avCacheKey(), function (list) {
            for (var i = list.length - 1; i >= 0; i--) if (list[i].__txId === id) list.splice(i, 1);
          }, renderAvTable);
          loadAvailTable();
        }, function () {
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-trash"></i>';
        });
      };
    });
  }

  function loadAvailTable() {
    var table = document.getElementById('avTable');
    if (table && cacheGet(avCacheKey()) === undefined) table.innerHTML = AV_TBL_HEAD + tblLoadingRow_(4);
    /* ดึงรายชื่อควบคู่ไปเลย (loadPeople มี cache ในตัว) — ตารางวาดเมื่อได้ครบทั้งสองอย่าง */
    return loadPeople().then(function (people) {
      avPeople_ = people;
      return swrGsRun({
        key: avCacheKey(),
        onData: renderAvTable,
        onError: function (err, hadCache) {
          if (hadCache) return;
          var t2 = document.getElementById('avTable');
          if (t2) { t2.innerHTML = AV_TBL_HEAD + tblErrorRow_(4, err, 'avRetry'); bindRetry_('avRetry', loadAvailTable); }
        }
      }, 'api_listAvailability', Session.token, current.year, current.month);
    });
  }

  /* ════════════════ ON-CALL (ported from renderOcForm()/addOC()/renderOcTbl()) ════════════════ */

  function renderOncallPage(page) {
    page.innerHTML =
      '<h2 style="margin:0 0 10px;font-size:16px;">บันทึก On-call — ' + monthLabel() + '</h2>' +
      '<div class="card" style="margin-bottom:14px;">' +
      '<div class="card-title" id="ocFormTitle"><i class="ti ti-phone-plus"></i>เพิ่มบันทึก On-call</div>' +

      '<label>เวลา<input id="ocTime" type="time"></label>' +
      '<label>HN<input id="ocHn"></label>' +

      '<div style="margin-top:14px;display:flex;gap:8px;">' +
      '<button class="btn btn-primary" id="ocAddBtn"><i class="ti ti-plus"></i> เพิ่มบันทึก</button>' +
      '<button class="btn" id="ocCancelEditBtn" style="display:none;">ยกเลิกแก้ไข</button>' +
      '</div></div>' +

    cachedGsRun('boot', 60000, 'api_bootstrap', Session.token).then(function (boot) {
      /* แอดมินเลือกได้ทุกคน (คีย์แทนคนอื่นได้) — ที่เหลือล็อกเป็นชื่อตัวเองเท่านั้น กันไปคีย์/แก้ของคนอื่น
         (ฝั่ง server บังคับ pid = ของตัวเองอีกชั้นอยู่แล้วใน api_addOnCall/api_updateOnCall) */
      var ocPidSel = document.getElementById('ocPid');
      if (isAdmin_()) {
        ocPidSel.innerHTML = boot.people.map(function (p) { return '<option value="' + p.id + '">' + fullN(p) + '</option>'; }).join('');
        ocPidSel.disabled = false;
        if (boot.user && boot.user.personId) ocPidSel.value = boot.user.personId;
      } else {
        var mine = boot.people.filter(function (p) { return p.id === boot.user.personId; })[0];
        ocPidSel.innerHTML = mine
          ? '<option value="' + mine.id + '">' + fullN(mine) + '</option>'
          : '<option value="">— บัญชีนี้ยังไม่ได้ผูกกับเจ้าหน้าที่ —</option>';
        ocPidSel.disabled = true;
        document.getElementById('ocAddBtn').disabled = !mine;
      }
      document.getElementById('ocUnit').innerHTML = (boot.settings.units || ['ER', 'IPD', 'OPD', 'LR']).map(function (u) { return '<option>' + u + '</option>'; }).join('');
      document.getElementById('ocLabChks').innerHTML = (boot.settings.labs || []).map(function (l) {

      document.querySelectorAll('#ocLabChks [data-oclab]').forEach(function (cb) { cb.onchange = syncLabAll; });
    });

    function setAllLabs(on) { document.querySelectorAll('#ocLabChks [data-oclab]').forEach(function (cb) { cb.checked = on; }); }
    function syncLabAll() {
      var boxes = document.querySelectorAll('#ocLabChks [data-oclab]');
      var allEl = document.getElementById('ocLabAll');
      if (allEl) allEl.checked = boxes.length > 0 && Array.prototype.every.call(boxes, function (cb) { return cb.checked; });
    }
    document.getElementById('ocLabAll').onchange = function () { setAllLabs(this.checked); };
    document.getElementById('ocLabClear').onclick = function () { setAllLabs(false); syncLabAll(); };

    function resetOcForm() {
      editingTxId = null;
      document.getElementById('ocDate').value = ''; document.getElementById('ocTime').value = '';
      document.getElementById('ocHn').value = ''; document.getElementById('ocName').value = '';
      setAllLabs(false); syncLabAll();
      document.getElementById('ocFormTitle').innerHTML = '<i class="ti ti-phone-plus"></i>เพิ่มบันทึก On-call';
      document.getElementById('ocAddBtn').innerHTML = '<i class="ti ti-plus"></i> เพิ่มบันทึก';
      document.getElementById('ocCancelEditBtn').style.display = 'none';
    }

    document.getElementById('ocCancelEditBtn').onclick = resetOcForm;

    document.getElementById('ocAddBtn').onclick = function () {
      var btn = this;
      if (btn.disabled) return; /* กันกดซ้ำระหว่างรอผลบันทึก */
      var labs = Array.prototype.slice.call(document.querySelectorAll('#ocLabChks [data-oclab]')).filter(function (cb) { return cb.checked; }).map(function (cb) { return cb.dataset.oclab; });
      var entry = {
        pid: document.getElementById('ocPid').value,
        date: document.getElementById('ocDate').value, time: document.getElementById('ocTime').value,
        hn: document.getElementById('ocHn').value, name: document.getElementById('ocName').value,
        unit: document.getElementById('ocUnit').value, labs: labs
      };
      var wasEditing = editingTxId;
      var prevBtnHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2 oc-spin"></i> กำลังบันทึก...';
      var call = wasEditing
        ? gsRun('api_updateOnCall', Session.token, current.year, current.month, wasEditing, entry)
        : gsRun('api_addOnCall', Session.token, current.year, current.month, entry);
      call.then(function (resp) {
        invalidateMonthCache();
        toast(wasEditing ? 'แก้ไขบันทึก On-call แล้ว' : 'เพิ่มบันทึก On-call แล้ว');
        btn.disabled = false;
        resetOcForm(); /* คืนข้อความปุ่มให้เอง */
        /* วาดรายการที่เซิร์ฟเวอร์ตอบรับแล้วลงตารางทันทีจาก cache — ไม่ต้องรอ round trip ที่สอง
           แล้วค่อย reconcile กับข้อมูลจริงเบื้องหลังผ่าน loadOncallTable() (ลำดับ/รูปแบบตามเซิร์ฟเวอร์เสมอ) */
        ocCachePatch(function (cal) {
          if (wasEditing) {
            cal.oncall.forEach(function (o, i) { if (o.__txId === wasEditing) cal.oncall[i] = mergeObj_(o, entry); });
          } else {
            cal.oncall.push(mergeObj_({ __txId: resp && resp.id }, entry));
          }
        });
        loadOncallTable();
      }, function () {
        /* gsRun เด้ง toast ข้อผิดพลาดให้แล้ว — คืนสภาพปุ่ม ฟอร์มยังอยู่ครบให้ลองใหม่ */
        btn.disabled = false;
        btn.innerHTML = prevBtnHtml;
      });
    };
    loadOncallTable();

    function startEditOc(o) {
      editingTxId = o.__txId;
      document.getElementById('ocPid').value = o.pid || '';
      document.getElementById('ocDate').value = o.date || '';
      document.getElementById('ocTime').value = o.time || '';
      document.getElementById('ocHn').value = o.hn || '';
      document.getElementById('ocName').value = o.name || '';
      document.getElementById('ocUnit').value = o.unit || '';
      var labSet = {}; (o.labs || []).forEach(function (l) { labSet[l] = true; });
      document.querySelectorAll('#ocLabChks [data-oclab]').forEach(function (cb) { cb.checked = !!labSet[cb.dataset.oclab]; });
      syncLabAll();
      document.getElementById('ocFormTitle').innerHTML = '<i class="ti ti-edit"></i>แก้ไขบันทึก On-call';
      document.getElementById('ocAddBtn').innerHTML = '<i class="ti ti-check"></i> บันทึกการแก้ไข';
      document.getElementById('ocCancelEditBtn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    page._startEditOc = startEditOc; // เรียกจาก loadOncallTable() (อยู่นอกฟังก์ชันนี้)
  }

  /* ใช้ api_getOnCallList (เบากว่า loadCalendarCached มาก — อ่านแค่ on-call + people)
     + stale-while-revalidate: มี cache ของเดือนนี้เมื่อไรวาดทันที (0 round trip ที่ต้องรอ)
     แล้วรีเฟรชข้อมูลจริงเบื้องหลังด้วย gsRunBg (ไม่เปิด overlay บังหน้าจอ) — เซิร์ฟเวอร์ยังเป็น
     source of truth เสมอ (ผล fetch ทับ cache ทุกครั้ง) จึงไม่กระทบ logic/ข้อมูลใดๆ */
  var OC_TBL_HEAD = '<tr><th>วันที่</th><th>เจ้าหน้าที่</th><th>เวลา</th><th>HN</th><th>ผู้ป่วย</th><th>หน่วยงาน</th><th>Lab</th><th></th></tr>';
  function ocCacheKey() { return ymKey('oc'); }
  function ocCachePatch(fn) { cachePatchAndPaint_(ocCacheKey(), fn, renderOcTable); }

  function renderOcTable(cal) {
    var page = document.getElementById('schedInner');
    var table = document.getElementById('ocTable');
    if (!table) return; /* ผู้ใช้สลับหน้าไปแล้วระหว่างรอ fetch เบื้องหลัง */
    var rows = cal.oncall.map(function (o) {
      var p = cal.people.filter(function (x) { return x.id === o.pid; })[0];
      /* เห็นรายการของทุกคนได้ แต่แก้ไข/ลบได้แค่ของตัวเอง ยกเว้นแอดมิน */
      var actions = canEditRecord_(o.pid)
        ? '<button class="btn btn-sm" data-edit="' + o.__txId + '"><i class="ti ti-edit"></i></button> <button class="btn btn-sm btn-danger" data-del="' + o.__txId + '"><i class="ti ti-trash"></i></button>'
        : '<span style="color:var(--mut);font-size:11px;">—</span>';
      return '<tr><td>' + o.date + '</td><td class="l">' + (p ? fullN(p) : o.pid) + '</td><td>' + (o.time || '') + '</td><td>' + (o.hn || '') + '</td><td class="l">' + (o.name || '') + '</td><td>' + (o.unit || '') + '</td><td class="l">' + (o.labs || []).join(', ') + '</td>' +
        '<td>' + actions + '</td></tr>';
    }).join('');
    table.innerHTML = OC_TBL_HEAD + (rows || '<tr><td colspan="8" style="color:var(--mut)">ยังไม่มีข้อมูล</td></tr>');
    table.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.onclick = function () {
        var o = cal.oncall.filter(function (x) { return x.__txId === btn.dataset.edit; })[0];
        if (o && page._startEditOc) page._startEditOc(o);
      };
    });
    table.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.dataset.del;
        btn.disabled = true;
        btn.innerHTML = '<i class="ti ti-loader-2 oc-spin"></i>';
        gsRun('api_deleteOnCall', Session.token, current.year, current.month, id).then(function () {
          invalidateMonthCache();
          toast('ลบแล้ว');
          /* เอาแถวออกจากตารางทันที (เซิร์ฟเวอร์ลบแล้ว) แล้วค่อย reconcile เบื้องหลัง */
          ocCachePatch(function (c) { c.oncall = c.oncall.filter(function (x) { return x.__txId !== id; }); });
          loadOncallTable();
        }, function () {
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-trash"></i>';
        });
      };
    });
  }

  function loadOncallTable() {
    var table = document.getElementById('ocTable');
    /* ยังไม่มี cache (เข้าหน้านี้ครั้งแรกของเดือน) — แสดง loading ในตารางแทน overlay เต็มจอ */
    if (table && cacheGet(ocCacheKey()) === undefined) table.innerHTML = OC_TBL_HEAD + tblLoadingRow_(8);
    return swrGsRun({
      key: ocCacheKey(),
      onData: renderOcTable,
      onError: function (err, hadCache) {
        if (hadCache) return; /* ยังมีข้อมูลเดิมให้ใช้งาน ไม่ต้องรบกวนผู้ใช้ */
        var t2 = document.getElementById('ocTable');
        if (t2) { t2.innerHTML = OC_TBL_HEAD + tblErrorRow_(8, err, 'ocRetry'); bindRetry_('ocRetry', loadOncallTable); }
      }
    }, 'api_getOnCallList', Session.token, current.year, current.month);
  }

  /* ════════════════ BALANCE (ported from renderBalance(), lines ~4178-4517) ════════════════
     Tolerance + group/swap math now lives server-side in BusinessService.calculateBalance —
     avoids shipping rate tables to the browser and keeps this a single cached round trip. */

  function bpMoney(n) { return Math.round(n).toLocaleString('th-TH') + ' ฿'; }
  var _bpTol = 650;

  function bpRoleBadge(role) {
    if (role === 'HT') return '<span style="font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;background:var(--gold-l);color:var(--gold)">HT</span>';

    return '<span style="font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;background:var(--tl-l);color:var(--tl-d)">MT</span>';

  function renderBalancePage(page) {
    page.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">' +
      '<h2 style="margin:0;font-size:16px;">สมดุลเวร (ค่าตอบแทน) — ' + monthLabel() + '</h2>' +
      '<label style="font-size:12.5px;font-weight:600;margin-left:8px;">Tolerance (บาท):</label>' +

      '<option value="0">0 — เท่าเทียมสูงสุด</option><option value="650" selected>≤ 650 บาท (≈1 เวร)</option><option value="1300">≤ 1,300 บาท (≈2 เวร)</option></select>' +
      '<button class="btn btn-sm" id="bpRecalcBtn" style="margin-left:auto;"><i class="ti ti-refresh"></i> คำนวณใหม่</button>' +
      '</div>' +
