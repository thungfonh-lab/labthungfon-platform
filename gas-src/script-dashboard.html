<script>
/* script-dashboard.html — หน้าหลัก (module picker): แสดงหลังล็อกอินสำเร็จ ให้ผู้ใช้เลือก
   โมดูลที่ต้องการใช้งาน โดยกรองตามสิทธิ์เข้าถึงรายโมดูล (moduleAllowed/ModulePerms ใน
   script-core.html) — โมดูลภายนอก (kind:'url') เปิดเป็นแท็บใหม่เสมอ
   (แทนที่แดชบอร์ดผู้บริหารเดิม — KPI/การแจ้งเตือนเชิงลึกดูได้ที่ ตารางเวร > แดชบอร์ด) */

var Dashboard = (function () {

  /* คำอธิบายสั้นของโมดูล builtin — โมดูล URL ที่ผู้ดูแลเพิ่มเองจะแสดง URL แทน */
  var MOD_DESC = {
    schedule: 'จัดตารางเวร เก็บวันลา รายงาน On Call และสมดุลเวร',
    admin: 'บัญชีผู้ใช้ จัดการโมดูล สิทธิ์เข้าถึง และข้อมูลระบบ',
    guide: 'คู่มือและวิธีใช้งานระบบ'
  };

  function render() {
    var page = document.getElementById('frame-dashboard');
    var user = Session.user || {};
    var mods = MODULE_REGISTRY.filter(moduleAllowed).filter(function (m) { return m.id !== 'dashboard'; });

    var cards = mods.map(function (m) {
      var isUrl = m.kind === 'url';
      var desc = isUrl ? (m.url || '') : (MOD_DESC[m.id] || '');
      return '<div class="modpick-card" data-mod="' + m.id + '" role="button" tabindex="0">' +
        '<div class="modpick-icon"><i class="ti ' + m.icon + '"></i></div>' +
        '<div class="modpick-body">' +
        '<div class="modpick-name">' + m.label +
        (isUrl ? ' <span class="badge none" style="font-weight:500;"><i class="ti ti-external-link"></i> ลิงก์ภายนอก</span>' : '') +
        '</div>' +
        (desc ? '<div class="modpick-desc">' + desc + '</div>' : '') +
        '</div>' +
        '<i class="ti ' + (isUrl ? 'ti-external-link' : 'ti-chevron-right') + ' modpick-go"></i>' +
        '</div>';
    }).join('');

    page.innerHTML =
      '<div class="modpick-head">' +
      '<h2 style="margin:0 0 4px;font-size:19px;">สวัสดี, ' + (user.name || '') + '</h2>' +
      '<p style="margin:0 0 18px;color:var(--mut);font-size:13px;">เลือกโมดูลที่ต้องการใช้งาน · แสดงเฉพาะโมดูลที่บัญชีของคุณมีสิทธิ์เข้าถึง</p>' +
      '</div>' +
      (mods.length
        ? '<div class="modpick-grid">' + cards + '</div>'
        : '<div class="card" style="color:var(--mut);font-size:13px;">บัญชีของคุณยังไม่มีสิทธิ์เข้าถึงโมดูลใด กรุณาติดต่อผู้ดูแลระบบ</div>');

    page.querySelectorAll('.modpick-card').forEach(function (el) {
      var open = function () { navTo(el.dataset.mod); }; /* navTo จัดการโมดูล URL ให้เปิดแท็บใหม่เอง */
      el.onclick = open;
      el.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    });
  }

  return { render: render };
})();
</script>
