<!-- ── LOGIN (ported layout from #loginScr in original; real email/password auth) ── -->
<div id="loginScr" style="position:fixed;inset:0;background:linear-gradient(135deg,var(--tl-d),var(--tl) 55%,var(--tl-m));display:grid;place-items:center;z-index:900;padding:20px;">
  <div style="background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:380px;padding:32px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
      <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--tl),var(--tl-d));color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;font-family:'IBM Plex Sans Thai';">L</div>
      <div>
        <div style="font-size:18px;font-weight:700;font-family:'IBM Plex Sans Thai';">labthungfon</div>
        <div style="font-size:11px;color:var(--mut);">Platform · กลุ่มงานเทคนิคการแพทย์</div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--mut);margin-bottom:20px;padding-top:10px;border-top:1px solid var(--border);">เข้าสู่ระบบด้วยบัญชีหน่วยงาน</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <input id="loginEmail" type="email" placeholder="อีเมล" style="padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--ink);outline:none;">
      <input id="loginPassword" type="password" placeholder="รหัสผ่าน" style="padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--ink);outline:none;">
      <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;padding:11px;">เข้าสู่ระบบ</button>
      <div id="loginError" style="color:var(--coral);font-size:12px;display:none;"></div>
    </div>
    <p style="font-size:10.5px;color:var(--mut);text-align:center;margin-top:14px;">labthungfon Platform · Google Workspace</p>
  </div>
</div>

<div id="app" style="display:none;">

  <!-- ── SIDEBAR ── -->
  <nav id="sb">
    <div class="sb-logo" id="sbLogo" title="ย่อ/ขยาย">
      <div class="mark" id="sbMark">L</div>
      <div class="brand">
        <div class="brand-name" id="sbBrandName">labthungfon</div>
        <div class="brand-sub" id="sbBrandSub">Platform · เทคนิคการแพทย์</div>
      </div>
    </div>
    <div class="sb-nav" id="sbNav"></div>
    <div class="sb-bottom">
      <div class="sb-item" id="logoutBtn"><i class="ti ti-logout" aria-hidden="true"></i><span class="lbl">ออกจากระบบ</span></div>
    </div>
  </nav>

  <!-- ── MAIN ── -->
  <div id="main">
    <div id="topbar">
      <button class="icon-btn" id="sbToggle" aria-label="Toggle sidebar"><i class="ti ti-menu-2"></i></button>
      <div>
        <div class="topbar-title" id="tbTitle">แดชบอร์ด</div>
        <div class="topbar-sub" id="tbSub">labthungfon Platform</div>
      </div>
      <div class="topbar-search">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="gSearch" placeholder="ค้นหา… (Ctrl+K)">
      </div>
      <div class="tb-spacer"></div>
      <div id="tbSchedMY" style="display:none;align-items:center;gap:6px;margin-right:8px;">
        <select id="selM" style="border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12.5px;background:var(--surface);color:var(--ink);"></select>
        <select id="selY" style="border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12.5px;background:var(--surface);color:var(--ink);"></select>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh"><i class="ti ti-refresh"></i></button>
        <button class="icon-btn" id="darkBtn" title="Dark mode" aria-label="Dark mode"><i class="ti ti-moon"></i></button>
        <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--tl-vl);border:1px solid var(--tl-l);border-radius:8px;cursor:pointer;" id="avatarBtn">
          <div style="width:26px;height:26px;border-radius:50%;background:var(--tl);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;" id="avatarInitial">A</div>
          <span id="avatarName" style="font-size:12px;font-weight:600;color:var(--tl-d);max-width:120px;overflow:hidden;white-space:nowrap;"></span>
        </div>
      </div>
    </div>

    <div id="content">
      <div class="frame active" id="frame-dashboard"></div>
      <div class="frame" id="frame-schedule"><div id="schedInner"></div></div>
      <div class="frame" id="frame-admin"></div>
      <div class="frame" id="frame-guide"></div>
    </div>
    <div id="appFooter" style="text-align:center;padding:10px 16px 14px;font-size:11px;color:var(--mut);border-top:1px solid var(--border);background:var(--surface);">
      labthungfon-platform โรงพยาบาลทุ่งฝน · พัฒนาโดย ทนพญ.เบญญาภา ธรา กลุ่มงานเทคนิคการแพทย์
    </div>
  </div>
</div>

<!-- #printSign อยู่นอก #app โดยตั้งใจ (ไม่ใช่ในตัว renderGridPage() แบบเดิม) — ตอนพิมพ์ขาวดำ
     ที่ html:not(.print-color) โดน filter:grayscale(1) ครอบ ถ้า #printSign (position:fixed) อยู่ใน
     subtree ที่โดน filter ครอบด้วย Chrome จะวาดเส้น/กรอบเปล่าๆ แปลกๆ ทับตอนพิมพ์ (บั๊กที่ทราบกันของ Chromium
     เรื่อง filter + position:fixed) ย้าย filter ไปอยู่ที่ #app แทน (ดู style.html) แล้วให้ #printSign
     เป็น sibling ของ #app ที่ไม่โดน filter ครอบ ก็จะพ้นบั๊กนี้ — ต้องเคลียร์เนื้อหาเองตอนออกจากตารางเวร
     (ดู render()/navTo() ใน script-schedule.html/script-core.html) เพราะไม่ได้อยู่ใน frame ระบบอีกต่อไป -->
